apiVersion: v1
kind: Secret
metadata:
  name: consentry-secrets
type: Opaque
stringData:
  DATABASE_URL: postgres://consentry:consentry@postgres:5432/consentry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consentry
  labels:
    app: consentry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: consentry
  template:
    metadata:
      labels:
        app: consentry
    spec:
      containers:
        - name: app
          image: consentry:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: consentry-secrets
          env:
            - name: HTTP_PORT
              value: "3000"
            - name: LOG_LEVEL
              value: info
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: consentry
spec:
  selector:
    app: consentry
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
